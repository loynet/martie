# Display name used when {{name}} appears in channer.system_prompt. It is not a
# gateway credential.
name = "Martie"

# ptchan-gateway is Martie's only ptchan boundary. Martie never reads from or
# posts to ptchan directly.
[ptchan]
# Public ptchan base URL. It is used when rendering thread context and links.
base_url = "https://ptchan.org"
# Signed gateway API URL. This example assumes a Docker service named
# ptchan-gateway; use an address reachable from the Martie process.
gateway_url = "http://ptchan-gateway:8080"
# Gateway integration identity. Its secret comes from
# PTCHAN_INTEGRATION_MARTIE_SECRET; replace both when changing this value.
integration_name = "martie"

# Channer is Martie's public mention responder.
[channer]
# A new post must contain one of these case-insensitive mentions to receive a
# response. Whitespace and duplicate values are removed at startup.
mentions = ["@martie"]
# Reject a triggering post above this many Unicode code points before reading
# context or calling the model.
max_input_runes = 4096
# Martie's public-response instructions. {{name}} expands to the top-level
# name. Keep this public-surface prompt separate from secrets.
system_prompt = "You are {{name}}, a helpful public ptchan assistant."
# How long admitted-event records remain in SQLite. Set to "0s" to retain the
# event ledger indefinitely. Retention must not be shorter than the period in
# which duplicate gateway delivery is a concern.
prune_after = "720h"

# Limits are local safeguards per Martie process, not gateway quotas.
[channer.rate_limit]
# Maximum admitted requests per hour across all threads.
global_per_hour = 25
# Maximum immediate global requests. It must be positive and no greater than
# global_per_hour.
global_burst = 3
# Maximum admitted requests per hour for one thread.
thread_per_hour = 6
# Maximum immediate requests for one thread. It must be positive and no greater
# than thread_per_hour.
thread_burst = 2

# Bounded, sanitized thread context supplied to the model for an admitted post.
[channer.ptchan_context]
# Maximum preceding/relevant replies included in the request-scoped context.
# Context is never persisted by Martie.
max_replies = 25

# DeepSeek completion settings. The API key belongs in DEEPSEEK_API_KEY, not
# this file.
[deepseek]
# Model identifier accepted by the configured DeepSeek account.
model = "deepseek-v4-flash"
# Upper bound requested for the generated completion. It must be positive.
max_tokens = 500

# Private listener for signed ptchan-gateway webhooks. Point the integration at
# <public Martie URL>/internal/ptchan/events; do not expose this listener to
# untrusted networks unless the gateway's signature verification remains intact.
[gateway.webhook]
addr = ":8081"

# Process-level health and Prometheus endpoint. Leave http_addr empty to disable
# it. Docker's default health check expects this to be reachable on :9090.
[runtime]
http_addr = ":9090"
[runtime.logging]
# JSON logs are always written to stdout. Choose the minimum severity to emit:
# debug, info, warn, or error.
level = "info"

# SQLite database path. Relative paths resolve from Martie's working directory;
# the Docker image maps data/martie.db to its persistent /data volume.
[storage]
sqlite_path = "data/martie.db"
