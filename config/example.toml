# Language for user-visible output and completion context: "en" or "pt-PT".
locale = "en"
# Assistant name used in prompts and Telegram attribution. ptchan display names
# and public tripcodes are configured on the corresponding gateway integration.
name = "Martie"

[ptchan]
# Public ptchan origin used when parsing and formatting thread links.
base_url = "https://ptchan.org"
# ptchan-gateway base URL used for signed context and posting requests.
gateway_url = "http://ptchan-gateway:8080"
# Integration name configured in ptchan-gateway. Give simultaneous dev and prod
# identities separate integrations, public tripcodes, and secrets. The matching
# secret is read from PTCHAN_INTEGRATION_<INTEGRATION_NAME>_SECRET, so "martie"
# uses PTCHAN_INTEGRATION_MARTIE_SECRET.
integration_name = "martie"

# Uncomment only when split deployments use separate ptchan-gateway integrations.
# [ptchan.chatter]
# integration_name = "martie-chatter"
#
# [ptchan.channer]
# integration_name = "martie-channer"
#
# [ptchan.threadnotifier]
# integration_name = "martie-threadnotifier"

[telegram]
# Channel or chat that receives gateway and stream notifications.
notification_chat_id = 123456789
# Linked discussion group where `chatter` accepts requests.
discussion_chat_id = -1001234567890
# Telegram user IDs allowed to invoke chatter when allow_all_users is false.
allowed_user_ids = [123456789]
# Set this instead of allowed_user_ids to permit every human in the discussion chat.
allow_all_users = false

[chatter]
# `chatter` and `channer` intentionally have separate system prompts and
# settings. Telegram has named users and group memory; ptchan is public,
# anonymous, quote-oriented, and should be handled by `channer`.
# Maximum Unicode characters accepted in one request.
max_input_runes = 4096
# Provider-facing personality and behavior. Replace this example in your
# untracked config with the character, voice, boundaries, and response style you
# want. Do not put Telegram or ptchan transcript-reading rules here; Martie
# generates those context packets itself.
# {{name}} is replaced with the top-level name in both prompts.
system_prompt = """
You are {{name}}, a helpful conversational assistant in Telegram.
"""

[chatter.memory]
# Forget exchanges after this duration and retain at most this many per topic.
ttl = "10m"
history_exchanges = 8

[chatter.rate_limit]
# Requests granted to each user per hour and the maximum immediate burst.
user_limit = 25
user_burst = 6
# Requests granted across all users per hour and the maximum immediate burst.
global_limit = 100
global_burst = 12

[chatter.ptchan_context]
# Render the OP when available plus this many focused or recent non-OP posts.
max_replies = 25

[channer]
# The ptchan-native assistant surface is invoked by signed gateway post events
# and replies through the signed gateway posting API, not by fetching or posting
# to ptchan directly.
# Case-insensitive ptchan mentions that invoke Martie.
mentions = ["@martie"]
# Maximum Unicode characters accepted in one ptchan post request.
max_input_runes = 4096
# Retain the one-shot idempotency ledger for this long. Set to "0s" to disable pruning.
prune_after = "720h"
# Separate public-posting personality and behavior for ptchan replies.
system_prompt = """
You are {{name}}, a helpful conversational assistant replying publicly on ptchan.
"""

[channer.rate_limit]
# Public replies granted across all threads per hour and maximum immediate burst.
request_limit = 25
request_burst = 3
# Public replies granted to one thread per hour and maximum immediate burst.
thread_limit = 6
thread_burst = 2

[channer.ptchan_context]
# Read sanitized thread data from ptchan-gateway for the triggering thread/post.
# Render the OP when available plus this many focused or recent non-OP posts.
max_replies = 25

[deepseek]
# Completion model sent to DeepSeek.
model = "deepseek-v4-flash"
# Maximum tokens DeepSeek may generate for one response.
max_tokens = 500

[gateway.webhook]
# Address where Martie accepts signed gateway webhooks at the stable
# /internal/ptchan/events path.
addr = ":8081"

[threadnotifier]
# Notify after this many observed reply posts.
min_reply_posts = 10
# Boards and case-insensitive OP text fragments excluded from tracking.
board_denylist = []
keyword_denylist = []
# Zero disables the age limit.
max_thread_age = "0s"
# Forget old tracked threads and sent notification/event receipts after this duration.
prune_after = "24h"

[runtime]
# Process health/readiness and Prometheus address. Empty disables the endpoint.
http_addr = ":9090"

[runtime.logging]
# Minimum log level: "debug", "info", "warn", or "error".
level = "info"
# Output encoding: human-readable "text" or structured "json".
format = "text"

[storage]
# SQLite location shared by default.
sqlite_path = "data/martie.db"

[streamnotifier]
# How often to probe configured streams.
poll_interval = "1m"

[[streamnotifier.channel]]
# Stable storage key, URL used to detect liveness, and public link sent to Telegram.
key = "main"
probe_url = "https://stream.example.com/main/llhls.m3u8"
page_url = "https://example.com/main"

[[streamnotifier.channel]]
# Repeat the same three fields for each additional stream.
key = "backup"
probe_url = "https://stream.example.com/backup/llhls.m3u8"
page_url = "https://example.com/backup"
